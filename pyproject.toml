[project]
name = "findex"
version = "0.7.0"
description = "Пошуковий рушій на чистому Python з FastAPI, Pydantic, Web UI та Typer CLI"
readme = "README.md"
authors = [
    { name = "Nikitavigov", email = "nikitavigov06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
